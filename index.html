<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typing Treasure Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: one focused screen at a time. Map = today's quest, then the trail of lesson stops, then treasures. Lesson = one card with the text, keyboard below. */
:root{
  --bg:#EAF0EC; --surface:#FFFFFF; --sunk:#F3F6F4; --ink:#1D2925; --muted:#5B6A64; --line:#D3DDD7;
  --pine:#276A52; --pine-ink:#FFFFFF; --honey:#E39A2D; --honey-soft:#FCEBCF; --bad:#C43D36; --bad-soft:#FBE1DE; --good:#23855A;
  --grass:#CDEBB8; --grass-ink:#3C6B2A;
  --f-p:#F3B9C7; --f-r:#F5D48A; --f-m:#A6DCBF; --f-i:#A9CAEF; --f-t:#D7CFF4; --key:#FFFFFF; --key-off:#EEF2EF;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A17; --surface:#1B2521; --sunk:#16201C; --ink:#E6EEEA; --muted:#9BAAA3; --line:#2D3B36;
  --pine:#62C29D; --pine-ink:#0D1A15; --honey:#F2B456; --honey-soft:#3A2E19; --bad:#F27D74; --bad-soft:#3D2120; --good:#6BD59F;
  --grass:#294A2A; --grass-ink:#BFE3A8;
  --f-p:#74404E; --f-r:#6E5A2A; --f-m:#2B6449; --f-i:#2D4F77; --f-t:#4E4679; --key:#24302B; --key-off:#1A2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A17; --surface:#1B2521; --sunk:#16201C; --ink:#E6EEEA; --muted:#9BAAA3; --line:#2D3B36;
  --pine:#62C29D; --pine-ink:#0D1A15; --honey:#F2B456; --honey-soft:#3A2E19; --bad:#F27D74; --bad-soft:#3D2120; --good:#6BD59F;
  --grass:#294A2A; --grass-ink:#BFE3A8;
  --f-p:#74404E; --f-r:#6E5A2A; --f-m:#2B6449; --f-i:#2D4F77; --f-t:#4E4679; --key:#24302B; --key-off:#1A2320; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,4vw,34px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--sunk);border:2px solid var(--line)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.big{font-size:21px;padding:14px 26px}
.btn:hover{filter:brightness(1.05)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:46px;height:46px;border-radius:14px;background:var(--honey);display:grid;place-items:center;font-size:26px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}

/* Quest */
.quest{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:720px){.quest{grid-template-columns:1fr}}
.quest-main{display:flex;flex-direction:column;gap:14px}
.paws{display:flex;gap:10px}
.paw{width:52px;height:52px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:24px;background:var(--sunk)}
.paw.done{border:3px solid var(--honey);background:var(--honey-soft)}
.goal-row{display:flex;gap:18px;flex-wrap:wrap}
.goal{display:flex;flex-direction:column}
.goal b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.goal span{font-size:14px;color:var(--muted)}
.next-up{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.friends{display:flex;flex-direction:column;gap:10px}
.friend-row{display:flex;flex-wrap:wrap;gap:8px}
.friend{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--sunk);border:1px solid var(--line)}
.friend.locked{font-family:var(--display);font-size:20px;color:var(--muted)}

/* Trail map */
.unit{display:flex;flex-direction:column;gap:12px}
.unit-head{display:flex;align-items:center;gap:12px}
.unit-animal{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface);border:1px solid var(--line);flex:none}
.unit-head p{font-size:15px}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.stop{position:relative;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.stop .num{font-family:var(--display);font-size:13px;color:var(--muted)}
.stop .name{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;padding-right:40px}
.stop .stars{color:var(--honey);font-size:17px;letter-spacing:2px;margin-top:auto}
.stop .stars .off{color:var(--line)}
.stop.next{border-color:var(--honey);box-shadow:0 0 0 3px var(--honey-soft)}
.stop.next::after{content:"Next";position:absolute;top:8px;right:10px;font-family:var(--display);font-size:12px;font-weight:600;background:var(--honey);color:#2a1c05;border-radius:999px;padding:1px 8px}
.stop.locked{background:var(--key-off);color:var(--muted);cursor:not-allowed}
.stop.locked .stars{display:none}
.stop .lock{margin-top:auto;font-size:14px}

.areas{display:flex;gap:8px;flex-wrap:wrap}
.area{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;display:grid;place-items:center}
.area.on{border-color:var(--honey);box-shadow:0 0 0 3px var(--honey-soft)}
.area:disabled{opacity:.5;cursor:not-allowed}
.foot{display:flex;justify-content:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}
.kbwrap{transition:opacity .25s}
.kbwrap.faded{opacity:.12}
.dig-btn{background:var(--honey);border-color:var(--honey);color:#2a1c05}
.pet{position:relative;display:inline-block;line-height:1;font-size:44px}
.pet.big{font-size:84px}
.pet .wear{position:absolute;left:50%;top:-.32em;transform:translateX(-50%) rotate(-12deg);font-size:.55em}
.pet .wear.w-shades{top:.18em;transform:translateX(-50%);font-size:.5em}
.pet .wear.w-party{top:auto;bottom:-.15em;left:85%;font-size:.45em}
.pet .wear.w-bow{left:70%;top:-.2em}
.pet .wear.w-flower{left:72%;top:-.18em}
.pet.shadowed .pe{filter:brightness(0);opacity:.25}
.pet.v-gold .pe{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.05)}
.pet.v-rainbow .pe{animation:rainbow 3s linear infinite}
@keyframes rainbow{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
.pet.pop{animation:popm .5s ease-out}
.reward{width:100%;max-width:560px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.reward h3{font-size:20px}
.ropts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ropt{width:150px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ropt:hover{border-color:var(--honey)}
.ropt .rl{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.2}
.ropt .rp{font-size:14px;color:var(--muted)}
.rgoal{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:17px}
.revealed{display:flex;flex-direction:column;align-items:center;gap:6px}
.petrow{display:flex;flex-wrap:wrap;gap:14px}
.petcard{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;text-align:center;font-size:13px;padding-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dig{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 20px;text-align:center}
.mound{font-size:80px;line-height:1}
.mound.pop{animation:popm .45s ease-out}
@keyframes popm{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.dword{font-family:var(--mono);font-size:clamp(34px,6vw,54px);letter-spacing:4px}
.dword .dd{color:var(--muted)} .dword .dc{background:var(--honey-soft);box-shadow:inset 0 -4px 0 var(--honey);border-radius:6px}
.dword.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.haul{font-size:30px;text-align:center;min-height:40px;word-break:break-all}
.intro{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.intro div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:18px}
.intro span{font-size:52px}
.mono{font-family:var(--mono)}
/* Treasures */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.finds li{display:flex;align-items:center;gap:10px;font-size:16px}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.finds li.found .tick{background:var(--honey);border-color:var(--honey);color:#2a1c05}
.finds li:not(.found){color:var(--muted)}
.keychips{display:flex;gap:8px;flex-wrap:wrap}
.keychip{font-family:var(--mono);font-weight:600;font-size:18px;min-width:40px;text-align:center;padding:6px 10px;border-radius:10px;background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:inherit;padding:10px}
details.parents summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px}
details.parents .inner{display:flex;flex-direction:column;gap:12px;margin-top:12px;max-width:65ch}
details.parents ul{margin:0;padding-left:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}

.tablewrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.log th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log .n{text-align:right} table.log .mono{font-family:var(--mono)}
button.chip{cursor:pointer}
/* Lesson screen */
.lbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lbar h2{flex:1;min-width:0}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--honey);transition:width .15s}
.live{display:flex;gap:10px}
.tip{font-size:17px;background:var(--honey-soft);border-radius:14px;padding:10px 16px}
.stage{position:relative}
.text{font-family:var(--mono);font-size:clamp(24px,3.4vw,34px);line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 26px}
.lines{height:calc(1.75em * 3);overflow:hidden;position:relative}
.w{white-space:nowrap;display:inline}
.ch{border-radius:6px;padding:0 1px;transition:background .08s}
.ch.done{color:var(--muted)}
.ch.done.miss{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:6px}
.ch.cur{background:var(--honey-soft);box-shadow:inset 0 -4px 0 var(--honey)}
.ch.cur.oops{background:var(--bad-soft);box-shadow:inset 0 -4px 0 var(--bad)}
.ch.sp{color:var(--line)}
.ch.sp.cur,.ch.sp.done{color:transparent}
.ch.sp.cur::before{content:""}
.hint{min-height:28px;font-size:18px;text-align:center}
.hint b{font-family:var(--display)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:20px;text-align:center;padding:16px}
.overlay div{display:flex;flex-direction:column;gap:10px;align-items:center}
.overlay .key-cap{font-family:var(--mono);font-weight:600;border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;padding:2px 14px;background:var(--key)}

/* Keyboard */
.kb{display:flex;flex-direction:column;gap:5px;max-width:860px;margin:0 auto;width:100%;user-select:none}
.kr{display:flex;gap:5px}
.k{flex:1 1 0;min-width:0;height:clamp(30px,5vw,48px);border-radius:9px;background:var(--key-off);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:clamp(11px,1.7vw,17px);color:var(--muted);position:relative}
.k.on{color:var(--ink);border-bottom-width:3px}
.k.z-lp.on,.k.z-rp.on{background:var(--f-p)} .k.z-lr.on,.k.z-rr.on{background:var(--f-r)}
.k.z-lm.on,.k.z-rm.on{background:var(--f-m)} .k.z-li.on,.k.z-ri.on{background:var(--f-i)} .k.z-th.on{background:var(--f-t)}
.k.bump::after{content:"";position:absolute;bottom:5px;width:12px;height:2px;border-radius:2px;background:currentColor}
.k.target{outline:4px solid var(--honey);outline-offset:1px;transform:translateY(-2px);color:var(--ink);font-weight:600;z-index:1}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* Results */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:30px 20px}
.bigstars{font-size:54px;letter-spacing:8px;color:var(--honey);line-height:1}
.bigstars .off{color:var(--line)}
.stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px}
.newfinds{display:flex;flex-direction:column;gap:6px}
.newfind{background:var(--honey-soft);border-radius:12px;padding:8px 16px;font-weight:700}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-30px;font-size:24px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@media (prefers-reduced-motion: reduce){.pet.pop,.pet.v-rainbow .pe,.mound.pop,.dword.shake{animation:none!important}.confetti{display:none}.k.target{transform:none}.meter i{transition:none}}
</style>
</head>

/* ---------- Text generators ---------- */
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
function groups(pool,focus,n,minL,maxL,focusP){
  var out=[]; for(var g=0;g<n;g++){ var L=minL+Math.floor(Math.random()*(maxL-minL+1)),s="";
    for(var c=0;c<L;c++) s+=(focus.length&&Math.random()<focusP)?rnd(focus):rnd(pool); out.push(s);} return out;
}
function letterPool(learned){ return learned.split("").filter(function(c){return /[a-z0-9]/.test(c);}); }
function drill(focusStr,learned){
  var f=focusStr.split(""), parts=[];
  f.forEach(function(c){parts.push(c+c+c);}); f.forEach(function(c){parts.push(c+c+c);});
  for(var r=0;r<2;r++) f.forEach(function(c){ var h=HOME[FINGER[c]];
    if(h&&h!==c&&/[a-z]/.test(c)) parts.push(h+c+h, c+h+c); else { var o=f[(f.indexOf(c)+1)%f.length]; parts.push(c+o, o+c); } });
  var pool=letterPool(learned); if(!pool.length) pool=f;
  return parts.concat(groups(pool,f,8,2,4,0.55)).join(" ");
}
function wordsFor(learned,focus,n){
  var allowed={}; learned.split("").forEach(function(c){allowed[c]=1;});
  var c=WORDS.filter(function(w){return w.split("").every(function(x){return allowed[x];});});
  var fset=(focus||"").split("");
  var withF=c.filter(function(w){return w.split("").some(function(x){return fset.indexOf(x)>=0;});});
  if(c.length<4) return null;
  var out=[],last=""; while(out.length<n){ var w=(withF.length&&Math.random()<0.7)?rnd(withF):rnd(c); if(w!==last){out.push(w); last=w;} }
  return out;
}
function trickyBits(learned){
  var tk=trickyKeys().filter(function(k){return /[a-z]/.test(k)&&learned.indexOf(k)>=0;}); if(!tk.length) return [];
  return groups(letterPool(learned),tk,2,3,3,0.6);
}
function buildText(l){
  switch(l.kind){
    case "drill": return drill(l.k,l.learned);
    case "mix": return groups(letterPool(l.learned),[],12,2,5,0).concat(trickyBits(l.learned)).join(" ");
    case "words": { var w=wordsFor(l.learned,l.f,13); if(!w) return drill(l.f,l.learned);
      if(l.learned.indexOf(".")>=0){ w=w.map(function(x,i){return (i%4===3)?x+".":(i%5===2?x+",":x);}); } return w.concat(trickyBits(l.learned)).join(" "); }
    case "caps": return shuffle(NAMES).slice(0,11).join(" ");
    case "sent": return shuffle(SENT).slice(0,3).join(" ");
    case "punct": return shuffle(PUNCT).slice(0,3).join(" ");
    case "facts": return shuffle(FACTS).slice(0,3).join(" ");
    case "story": return STORY[l.part];
    case "nums": return shuffle(NUMS).slice(0,3).join(" ");
    case "tricky": { var tk=l.k.split(""), learned=learnedNow(); var g=groups(tk.concat(letterPool(learned)).filter(function(x){return /[a-z0-9]/.test(x);}),tk,6,2,4,0.7);
      var w=wordsFor(learned,l.k,8)||[]; return g.concat(w).join(" "); }
    case "custom": return l.text;
  }
  return "fff jjj";
}

/* ---------- Progress report (for grown-ups) ---------- */
function fmtDate(iso){ var d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtTime(iso){ var d=new Date(iso); return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function trendSvg(log){
  var pts=log.slice(-40); if(pts.length<2) return "<p class=\"muted\">The chart appears after two attempts.</p>";
  var W=640,H=200,pl=40,pr=40,pt=14,pb=26, n=pts.length;
  var maxW=Math.max(20,Math.ceil(Math.max.apply(null,pts.map(function(p){return p.wpm;}))/10)*10);
  function x(i){return pl+(W-pl-pr)*i/(n-1);} function yW(v){return pt+(H-pt-pb)*(1-v/maxW);} function yA(v){return pt+(H-pt-pb)*(1-(Math.max(v,70)-70)/30);}
  var g="";
  [0,0.5,1].forEach(function(f){var y=pt+(H-pt-pb)*f; g+="<line x1=\""+pl+"\" x2=\""+(W-pr)+"\" y1=\""+y+"\" y2=\""+y+"\" stroke=\"var(--line)\" stroke-width=\"1\"/>";
    g+="<text x=\""+(pl-6)+"\" y=\""+(y+4)+"\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--pine)\">"+Math.round(maxW*(1-f))+"</text>";
    g+="<text x=\""+(W-pr+6)+"\" y=\""+(y+4)+"\" font-size=\"11\" fill=\"var(--honey)\">"+Math.round(100-30*f)+"%</text>";});
  var a=pts.map(function(p,i){return x(i)+","+yA(p.acc);}).join(" "), w=pts.map(function(p,i){return x(i)+","+yW(p.wpm);}).join(" ");
  g+="<polyline points=\""+a+"\" fill=\"none\" stroke=\"var(--honey)\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>";
  g+="<polyline points=\""+w+"\" fill=\"none\" stroke=\"var(--pine)\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>";
  g+="<circle cx=\""+x(n-1)+"\" cy=\""+yW(pts[n-1].wpm)+"\" r=\"4\" fill=\"var(--pine)\"/><circle cx=\""+x(n-1)+"\" cy=\""+yA(pts[n-1].acc)+"\" r=\"4\" fill=\"var(--honey)\"/>";
  g+="<text x=\""+pl+"\" y=\""+(H-6)+"\" font-size=\"11\" fill=\"var(--muted)\">"+esc(fmtDate(pts[0].at))+"</text><text x=\""+(W-pr)+"\" y=\""+(H-6)+"\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">"+esc(fmtDate(pts[n-1].at))+"</text>";
  return "<div style=\"overflow-x:auto\"><svg viewBox=\"0 0 "+W+" "+H+"\" width=\"100%\" style=\"max-width:"+W+"px;display:block\" role=\"img\" aria-label=\"Speed and accuracy over the last "+n+" attempts\">"+g+"</svg></div>"+
    "<div class=\"legend\" style=\"justify-content:flex-start\"><span><i style=\"background:var(--pine)\"></i>Words a minute (left)</span><span><i style=\"background:var(--honey)\"></i>Accuracy (right)</span></div>";
}
function csv(){
  var rows=[["Student","Date","Time","Stop","Lesson","Accuracy %","WPM","Stars","Mistakes","Missed keys","Gems"]];
  S.log.forEach(function(r){ var d=new Date(r.at); rows.push([studentName(),today(d),d.toTimeString().slice(0,5),r.stop,r.lesson,r.acc,r.wpm,r.stars,r.mistakes,r.missed,r.gems]); });
  return rows.map(function(r){return r.map(function(v){v=String(v); return /[",\n]/.test(v)?"\""+v.replace(/"/g,"\"\"")+"\"":v;}).join(",");}).join("\n");
}
function sheetSection(){
  if(!sheetReady()) return "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:10px\"><h2>Google Sheet</h2><p class=\"muted\">Not set up yet. Paste the Google Sheet link in Settings below, and every attempt will be added to the sheet.</p></section>";
  var pend=S.log.filter(function(r){return !r.synced;}).length;
  var url=SHEET.id?"https://docs.google.com/spreadsheets/d/"+encodeURIComponent(SHEET.id)+"/edit":"";
  var line = SHEET.status==="error"||SHEET.status==="off" ? "<p style=\"color:var(--bad)\">"+esc(SHEET.msg)+"</p>"
    : pend ? "<p class=\"muted\">"+pend+" "+(pend===1?"attempt is":"attempts are")+" waiting to be sent.</p>" : "<p class=\"muted\">Every attempt is in the sheet. A new row is added after each lesson.</p>";
  return "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"row\" style=\"justify-content:space-between\"><h2>Google Sheet</h2><div class=\"row\">"+
    (pend||SHEET.status==="error"?"<button class=\"btn primary\" id=\"sheetsend\">Send to Google Sheet</button>":"")+
    (url?"<a class=\"btn\" href=\""+url+"\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none\">Open the sheet</a>":"")+"</div></div>"+line+"</section>";
}
function saveFile(name,text,type,msgEl){
  function plain(){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1000); if(msgEl) msgEl.textContent="Saved to your Downloads folder."; }catch(e){ if(msgEl) msgEl.textContent="The download didn't work here."; } }
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(dl){
      if(!dl) return plain();
      dl.save({filename:name,data:text}).then(function(){ if(msgEl) msgEl.textContent="Saved."; },function(e){ if(msgEl) msgEl.textContent = e&&e.code==="declined" ? "Download cancelled." : "The download didn't work here. Try again in a moment."; });
    },plain);
  } else plain();
}
function renderReport(){
  stopLesson(); currentView="report";
  var log=S.log, last10=log.slice(-10), daysPracticed=Object.keys(S.days).length, passedN=LESSONS.filter(function(l,i){return passed(i);}).length;
  var avgAcc=last10.length?Math.round(last10.reduce(function(a,r){return a+r.acc;},0)/last10.length):0;
  var avgW=last10.length?Math.round(last10.reduce(function(a,r){return a+r.wpm;},0)/last10.length):0;
  var tk=trickyKeys();
  // last 14 days strip
  var strip="", d=new Date(); d.setDate(d.getDate()-13);
  for(var i=0;i<14;i++){ var k=today(d), n=S.days[k]||0; strip+="<div title=\""+k+": "+n+" lessons\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)\"><div class=\"paw"+(n>=S.goal?" done":"")+"\" style=\"width:30px;height:30px;font-size:13px;border-width:2px\">"+(n||"")+"</div>"+d.toLocaleDateString(undefined,{weekday:"narrow"})+"</div>"; d.setDate(d.getDate()+1); }
  var rows=log.slice(-50).reverse().map(function(r){return "<tr><td>"+esc(fmtDate(r.at))+" "+esc(fmtTime(r.at))+"</td><td>"+esc(r.lesson)+"</td><td class=\"n\">"+r.acc+"%</td><td class=\"n\">"+r.wpm+"</td><td>"+starsHtml(r.stars)+"</td><td class=\"mono\">"+esc(r.missed||"")+"</td></tr>";}).join("");
  var h="<header class=\"top\"><div><h1>For grown-ups: "+esc(studentName())+"</h1><p class=\"muted\">Every attempt is recorded here. "+(DB?(cloudOk?"Saved to your Claude account.":"Saving to your Claude account..."):"Saved in this browser on this computer.")+"</p></div><div class=\"chips\">"+backBtn("back2")+"</div></header>"+
   "<section class=\"card\"><div class=\"stats\" style=\"justify-content:space-between\">"+
   "<div class=\"stat\"><b>"+passedN+" / "+LESSONS.length+"</b><span>stops passed</span></div>"+
   "<div class=\"stat\"><b>"+daysPracticed+"</b><span>days practiced</span></div>"+
   "<div class=\"stat\"><b>"+streak()+"</b><span>day streak</span></div>"+
   "<div class=\"stat\"><b>"+avgAcc+"%</b><span>accuracy, last 10</span></div>"+
   "<div class=\"stat\"><b>"+avgW+"</b><span>wpm, last 10</span></div>"+
   "<div class=\"stat\"><b>"+Math.round(S.bestWpm)+"</b><span>best wpm</span></div></div></section>"+
   sheetSection()+
   "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><h2>Last 14 days</h2><p class=\"muted\">Lessons passed each day. Filled paws met the daily quest of "+S.goal+".</p><div style=\"display:flex;gap:6px;flex-wrap:wrap\">"+strip+"</div></section>"+
   "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><h2>Speed and accuracy</h2>"+trendSvg(log)+"</section>"+
   "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><h2>Keys to practise</h2>"+(tk.length?"<div class=\"keychips\">"+tk.map(function(k){return "<span class=\"keychip\">"+esc(keyLabel(k))+" · "+Math.round(100*(S.kErr[k]||0)/S.kTot[k])+"% missed</span>";}).join("")+"</div>":"<p class=\"muted\">No problem keys yet.</p>")+"</section>"+
   "<section class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><div class=\"row\" style=\"justify-content:space-between\"><h2>Every attempt</h2><button class=\"btn\" id=\"csvb\">Download as a spreadsheet (.csv)</button></div><p class=\"muted\" id=\"csvmsg\">"+(log.length>50?"Showing the latest 50 of "+log.length+". The download has all of them.":"Showing all "+log.length+" "+(log.length===1?"attempt":"attempts")+".")+"</p>"+
   (rows?"<div class=\"tablewrap\"><table class=\"log\"><thead><tr><th>When</th><th>Lesson</th><th class=\"n\">Accuracy</th><th class=\"n\">WPM</th><th>Stars</th><th>Missed keys</th></tr></thead><tbody>"+rows+"</tbody></table></div>":"<p class=\"muted\">No attempts yet. They appear here after her first lesson.</p>")+"</section>"+settingsHtml();
  app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("back2").onclick=renderMap;
  var sb=document.getElementById("sheetsend"); if(sb) sb.onclick=function(){ sb.disabled=true; sb.textContent="Sending..."; syncPending(true); };
  bindSettings();
  document.getElementById("csvb").onclick=function(){ saveFile("typing-progress-"+today()+".csv", csv(), "text/csv", document.getElementById("csvmsg")); };
}
function clean(t){ return t.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,"\"").replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...").replace(/\s+/g," ").replace(/[^\x20-\x7E]/g,"").trim().slice(0,700); }

/* ---------- Lesson ---------- */
var L=null; // running lesson state
function stopLesson(){ L=null; }

var KB_ROWS=[
 [["`"],["1"],["2"],["3"],["4"],["5"],["6"],["7"],["8"],["9"],["0"],["-"],["="],["bk","⌫",1.8]],
 [["tab","tab",1.5],["q"],["w"],["e"],["r"],["t"],["y"],["u"],["i"],["o"],["p"],["["],["]"],["\\","\\",1.3]],
 [["caps","caps",1.8],["a"],["s"],["d"],["f"],["g"],["h"],["j"],["k"],["l"],[";"],["'"],["enter","enter",2]],
 [["shiftL","shift",2.4],["z"],["x"],["c"],["v"],["b"],["n"],["m"],[","],["."],["/"],["shiftR","shift",2.4]],
 [["sp0","",3.6],[" ","space",6.5],["sp1","",3.6]]
];
function kbHtml(learned){
  var on={}; learned.split("").forEach(function(c){on[c]=1;}); on[" "]=1;
  var caps=learned.indexOf("⇧")>=0;
  return "<div class=\"kb\" aria-hidden=\"true\">"+KB_ROWS.map(function(r){return "<div class=\"kr\">"+r.map(function(k){
    var id=k[0], label=k[1]!==undefined?k[1]:id.toUpperCase(), w=k[2]||1, f=FINGER[id], cls="k";
    if(f) cls+=" z-"+f; if(on[id]) cls+=" on"; if((id==="shiftL"||id==="shiftR")&&caps) cls+=" z-"+(id==="shiftL"?"lp":"rp")+" on";
    if(id==="f"||id==="j") cls+=" bump"; if(id==="sp0"||id==="sp1") cls+=" spacer";
    return "<div class=\""+cls+"\" data-k=\""+esc(id)+"\" style=\"flex-grow:"+w+(id.indexOf("sp")===0&&id!==" "?";visibility:hidden":"")+"\">"+esc(label)+"</div>";
  }).join("")+"</div>";}).join("")+"</div>"+
  "<div class=\"legend\"><span><i style=\"background:var(--f-p)\"></i>Pinky</span><span><i style=\"background:var(--f-r)\"></i>Ring</span><span><i style=\"background:var(--f-m)\"></i>Middle</span><span><i style=\"background:var(--f-i)\"></i>Pointer</span><span><i style=\"background:var(--f-t)\"></i>Thumb</span></div>";
}
var SHORTF={lp:"left pinky",lr:"left ring",lm:"left middle",li:"left pointer",ri:"right pointer",rm:"right middle",rr:"right ring",rp:"right pinky",th:"thumb"};
function tipFor(l){
  if(l.kind==="drill"){
    if(l.idx===0) return "Feel the bumps on <b>F</b> and <b>J</b>.";
    return "New: "+l.k.split("").map(function(c){return "<b>"+esc(keyLabel(c))+"</b> ("+SHORTF[FINGER[c]]+")";}).join(", ");
  }
  if(l.kind==="caps") return "Hold <b>Shift</b> with the other hand's pinky.";
  if(l.kind==="punct") return "<b>?</b> = Shift + /";
  if(l.kind==="story") return "Your story: The Bear";
  return "Careful beats fast.";
}
function startLesson(l){
  var text=buildText(l);
  L={l:l,text:text,i:0,miss:{},firstMiss:{},started:false,active:0,last:0,done:false,ready:false,oops:false,
     fade: l.unit!==undefined ? (unitDone(l.unit)||l.unit>=4) : unitDone(3)};
  var learned = l.kind==="custom" ? "abcdefghijklmnopqrstuvwxyz0123456789;',./-=⇧" : l.kind==="tricky" ? learnedNow() : l.learned;
  var html="", n=0;
  // keep each word and its trailing space together so lines never split a word
  var chunks=text.match(/[^ ]+ ?| /g)||[];
  chunks.forEach(function(w){ html+="<span class=\"w\">"; for(var j=0;j<w.length;j++){ var c=w[j]; html+="<span class=\"ch"+(c===" "?" sp":"")+"\" id=\"c"+n+"\">"+(c===" "?"·":esc(c))+"</span>"; n++; } html+="</span><wbr>"; });
  app.innerHTML=
   "<div class=\"lbar\"><button class=\"btn\" id=\"back\">← Map</button><h2>"+esc(l.t)+"</h2><div class=\"live\"><span class=\"chip\" id=\"acc\" title=\"Accuracy\">100%</span></div></div>"+
   "<div class=\"meter\" aria-hidden=\"true\"><i id=\"bar\"></i></div>"+
   "<p class=\"tip\">"+tipFor(l)+"</p>"+
   "<div class=\"stage\"><div class=\"text\"><div class=\"lines\" id=\"text\">"+html+"</div></div>"+
   "<div class=\"overlay\" id=\"ov\"><div><h2>Fingers on home row</h2><p>Press <span class=\"key-cap\">Space</span> to start</p></div></div></div>"+
   "<p class=\"hint\" id=\"hint\"></p><div id=\"kbwrap\" class=\"kbwrap\">"+kbHtml(learned)+"</div>";
  document.getElementById("back").onclick=renderMap;
  document.getElementById("ov").onclick=function(){ window.focus(); };
  paint();
  window.scrollTo(0,0);
}
function setOverlay(show,msg){
  var ov=document.getElementById("ov"); if(!ov) return; ov.hidden=!show;
  if(show&&msg) ov.querySelector("h2").textContent=msg;
}
function paint(){
  if(!L) return;
  var prev=document.querySelector(".ch.cur"); if(prev) prev.classList.remove("cur","oops");
  var el=document.getElementById("c"+L.i);
  if(el){ el.classList.add("cur"); if(L.oops) el.classList.add("oops");
    var box=document.getElementById("text"); var top=el.offsetTop; var lh=el.offsetHeight||40;
    box.scrollTop=Math.max(0, top-lh*1.1); }
  document.querySelectorAll(".k.target").forEach(function(k){k.classList.remove("target");});
  var c=L.text[L.i], hint=document.getElementById("hint");
  if(c!==undefined){
    var b=baseKey(c), ke=keyEl(b); if(ke) ke.classList.add("target");
    var shiftTxt="";
    if(needsShift(c)){ var s=shiftFor(c); var se=keyEl(s); if(se) se.classList.add("target"); shiftTxt=" + <b>Shift</b> with your "+(s==="shiftL"?"left":"right")+" pinky"; }
    hint.innerHTML = (L.oops ? "Try again: " : "")+"<b>"+esc(c===" "?"Space":c)+"</b> · "+SHORTF[FINGER[b]]+(needsShift(c)?" + Shift":"");
  }
  var kw=document.getElementById("kbwrap"); if(kw) kw.classList.toggle("faded", !!(L.fade && !L.oops && L.ready));
  var tot=L.text.length, missN=Object.keys(L.firstMiss).length, typed=L.i;
  document.getElementById("bar").style.width=(100*typed/tot)+"%";
  document.getElementById("acc").textContent=(typed>=10?Math.round(100*(typed-missN)/typed):100)+"%";
}
function keyEl(id){ var all=document.querySelectorAll(".k"); for(var i=0;i<all.length;i++){ if(all[i].dataset.k===id) return all[i]; } return null; }
function wpm(){ if(!L||!L.started||L.active<1500) return 0; return Math.round((L.i/5)/(L.active/60000)); }

document.addEventListener("keydown",function(e){
  if(G&&currentView==="dig"){ digKey(e); return; }
  if(!L||L.done) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape"){ renderMap(); return; }
  if(e.key.length!==1) { if(e.key==="Backspace") e.preventDefault(); return; }
  e.preventDefault();
  if(!L.ready){ if(e.key===" "){ L.ready=true; setOverlay(false); paint(); } return; }
  var now=performance.now();
  if(!L.started){L.started=true; L.last=now;} else { L.active+=Math.min(now-L.last,3000); L.last=now; }
  var exp=L.text[L.i], b=baseKey(exp);
  if(!(L.i in L.miss)){ /* first attempt at this character */ S.kTot[b]=(S.kTot[b]||0)+1; L.miss[L.i]=0; }
  if(e.key===exp){
    var el=document.getElementById("c"+L.i); el.classList.add("done"); if(L.firstMiss[L.i]) el.classList.add("miss");
    L.i++; L.oops=false; sndKey();
    if(L.i>=L.text.length){ finish(); return; }
  } else {
    if(!L.firstMiss[L.i]){ L.firstMiss[L.i]=1; S.kErr[b]=(S.kErr[b]||0)+1; }
    L.oops=true; sndOops();
  }
  paint();
});
window.addEventListener("blur",function(){ if(L&&L.ready&&!L.done){ L.ready=false; setOverlay(true,"Paused"); } });

/* ---------- Results ---------- */
var CHEERS3=["Treasure found!","Super careful paws!","Wow, nearly perfect!"];
var CHEERS2=["Great digging!","Nice work, explorer!","So close to three stars!"];
var CHEERS1=["You unlocked the next stop!","Good job. Keep going!"];
function finish(){
  L.done=true;
  var tot=L.text.length, miss=Object.keys(L.firstMiss).length, acc=Math.round(1000*(tot-miss)/tot)/10, sp=wpm(), l=L.l;
  var stars = acc>=98?3: acc>=95?2: acc>=90?1:0;
  var newFinds=[], gemsEarned=0, recordSpeed=false, unitBefore = l.unit!==undefined ? unitDone(l.unit) : true;
  function find(id){ if(!S.finds[id]){ S.finds[id]=Date.now(); newFinds.push(FINDS.filter(function(f){return f.id===id;})[0].t); } }
  if(stars>0){
    var beforeQuest=todayCount();
    S.days[today()]=beforeQuest+1;
    gemsEarned=stars + (beforeQuest+1===S.goal?5:0);
    S.gems+=gemsEarned;
    if(l.id){ var b=S.best[l.id]; if(!b||stars>b.stars||(stars===b.stars&&sp>b.wpm)) S.best[l.id]={stars:Math.max(stars,b?b.stars:0),wpm:Math.max(sp,b?b.wpm:0),acc:Math.max(acc,b?b.acc:0)}; }
    if(sp>S.bestWpm && tot>=40){ if(S.bestWpm>0) recordSpeed=true; S.bestWpm=sp; }
    find("first");
    if(acc>=100) find("perfect");
    if(S.days[today()]>=S.goal) find("quest");
    var st=streak(); if(st>=3) find("streak3"); if(st>=7) find("streak7");
    if(S.gems>=50) find("gems50"); if(S.gems>=150) find("gems150");
    if(sp>=15) find("speed15"); if(sp>=25) find("speed25");
    if(l.kind==="tricky") find("tricky");
    if(l.kind==="custom") find("craft");
    if(l.kind==="story"){ S.storyParts[l.part]=1; if(S.storyParts[0]&&S.storyParts[1]&&S.storyParts[2]) find("story"); }
  }
  S.log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),stop:l.id?l.idx+1:"",lesson:l.t,acc:acc,wpm:sp,stars:stars,chars:tot,mistakes:miss,
    missed:Object.keys(L.firstMiss).map(function(i){return baseKey(L.text[i]);}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(" "),gems:gemsEarned});
  if(S.log.length>600) S.log=S.log.slice(-600);
  save();
  syncPending(false);
  var newFriend = l.unit!==undefined && !unitBefore && unitDone(l.unit) ? COURSE[l.unit] : null;
  var questDone = stars>0 && todayCount()===S.goal;

  var title = stars===3?rnd(CHEERS3):stars===2?rnd(CHEERS2):stars===1?rnd(CHEERS1):"Almost there!";
  var hasNext = l.id && l.idx<LESSONS.length-1;
  var h="<div class=\"card result\">"+starsHtml(stars,"bigstars")+"<h1>"+esc(title)+"</h1>";
  if(stars===0) h+="<p style=\"max-width:44ch\">Get 90% to unlock the next stop. Go a little slower.</p>";
  h+="<div class=\"stats\"><div class=\"stat\"><b>"+acc+"%</b><span>accuracy</span></div><div class=\"stat\"><b>"+sp+"</b><span>words a minute</span></div>"+
     (gemsEarned?"<div class=\"stat\"><b>+"+gemsEarned+" 💎</b><span>gems</span></div>":"")+"</div>";
  var notes=[];
  if(newFriend) notes.push("You met a new friend: the "+newFriend.friend+" "+newFriend.animal);
  if(questDone) notes.push("Today's quest is complete! +5 bonus gems");
  if(recordSpeed) notes.push("New speed record: "+sp+" words a minute");
  newFinds.forEach(function(t){ if(!(questDone&&t==="Quest complete")) notes.push("Treasure found: "+t);});
  notes=notes.slice(0,2);
  if(notes.length) h+="<div class=\"newfinds\">"+notes.map(function(n){return "<div class=\"newfind\">"+esc(n)+"</div>";}).join("")+"</div>";
  if(!notes.length && stars>0 && !questDone && todayCount()<S.goal) h+="<p class=\"muted\">Quest: "+todayCount()+" of "+S.goal+" lessons today.</p>";
  if(stars>0) h+=rewardHtml();
  h+="<div class=\"row\" style=\"justify-content:center\">";
  if(questDone&&digReady()) h+="<button class=\"btn primary big dig-btn\" id=\"digb\">⛏️ Bonus dig!</button>";
  if(stars>0&&hasNext) h+="<button class=\"btn "+(questDone&&digReady()?"":"primary ")+"big\" id=\"nextb\">Next stop</button><button class=\"btn big\" id=\"again\">Try again</button>";
  else h+="<button class=\"btn primary big\" id=\"again\">Try again</button>";
  h+="<button class=\"btn big\" id=\"mapb\">Map</button></div></div>";
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){startLesson(l);};
  document.getElementById("mapb").onclick=renderMap;
  var dgb=document.getElementById("digb"); if(dgb) dgb.onclick=renderDig;
  var nb=document.getElementById("nextb"); if(nb){ nb.onclick=function(){startLesson(LESSONS[l.idx+1]);}; nb.focus(); }
  bindReward(function(){ var f=document.getElementById("digb")||nb||document.getElementById("again"); if(f) f.focus(); });
  if(stars>0){ confetti(stars+(newFriend||questDone?3:0)); sndWin(); }
}
function confetti(n){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box=document.createElement("div"); box.className="confetti"; var items=["💎","⭐","🪙","🐾"];
  for(var i=0;i<n*6;i++){ var e=document.createElement("i"); e.textContent=rnd(items); e.style.left=(Math.random()*100)+"%"; e.style.animationDelay=(Math.random()*0.6)+"s"; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(function(){box.remove();},2800);
}

if(META.students.length>1||!student()) renderPicker(); else renderMap();
connectCloud();
})();
